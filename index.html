        function InteractiveCV() {
            const [expandedNodes, setExpandedNodes] = useState(new Set(['root']));
            const [nodePositions, setNodePositions] = useState({});
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [zoom, setZoom] = useState(1);
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [showInstructions, setShowInstructions] = useState(true);
            const containerRef = useRef(null);

            useEffect(() => {
                calculatePositions();
            }, [expandedNodes]);

            const calculatePositions = () => {
                const positions = {};
                const container = containerRef.current;
                if (!container) return;

                const centerX = container.clientWidth / 2;
                const centerY = container.clientHeight / 2;

                const horizontalSpacing = {
                    'primary': 400,
                    'secondary': 360,
                    'meta': 320
                };

                const verticalSpacing = {
                    'primary': 120,
                    'secondary': 90,
                    'meta': 52
                };

                function getNodeDimensions(node) {
                    const sizes = {
                        'core': { width: 360, height: 120 },
                        'primary': { width: 240, height: 60 },
                        'secondary': { width: 240, height: 58 },
                        'meta': { width: 320, height: 40 }
                    };
                    return sizes[node.tier] || sizes['secondary'];
                }

                function calculateSubtreeHeight(node) {
                    if (!expandedNodes.has(node.id) || !node.children || node.children.length === 0) {
                        return getNodeDimensions(node).height;
                    }
                    let totalHeight = 0;
                    node.children.forEach((child, idx) => {
                        totalHeight += calculateSubtreeHeight(child);
                        if (idx < node.children.length - 1) {
                            totalHeight += (verticalSpacing[child.tier] || 60);
                        }
                    });
                    return Math.max(totalHeight, getNodeDimensions(node).height);
                }

                function positionNode(node, depth, parentPos, availableHeight, offsetY) {
                    const dims = getNodeDimensions(node);
                    const isRoot = node.tier === 'core';

                    if (isRoot) {
                        positions[node.id] = {
                            x: 180,
                            y: centerY,
                            tier: node.tier,
                            width: dims.width,
                            height: dims.height
                        };
                    } else {
                        const horizontalOffset = horizontalSpacing[node.tier] || 300;
                        positions[node.id] = {
                            x: parentPos.x + horizontalOffset,
                            y: offsetY + availableHeight / 2,
                            tier: node.tier,
                            width: dims.width,
                            height: dims.height
                        };
                    }

                    if (expandedNodes.has(node.id) && node.children && node.children.length > 0) {
                        const currentPos = positions[node.id];
                        const childrenHeights = node.children.map(c => calculateSubtreeHeight(c));
                        const totalChildrenHeight = childrenHeights.reduce((sum, h, idx) => {
                            return sum + h + (idx < childrenHeights.length - 1 ? (verticalSpacing[node.children[idx].tier] || 60) : 0);
                        }, 0);

                        let startY = currentPos.y - totalChildrenHeight / 2;
                        node.children.forEach((child, idx) => {
                            positionNode(child, depth + 1, currentPos, childrenHeights[idx], startY);
                            startY += childrenHeights[idx] + (verticalSpacing[child.tier] || 60);
                        });
                    }
                }

                positionNode(cvData, 0, null, calculateSubtreeHeight(cvData), 0);
                setNodePositions(positions);
            };

            const toggleNode = (nodeId) => {
                const newExpanded = new Set(expandedNodes);
                if (newExpanded.has(nodeId)) {
                    const collapseChildren = (id) => {
                        newExpanded.delete(id);
                        const node = findNode(cvData, id);
                        if (node?.children) node.children.forEach(c => collapseChildren(c.id));
                    };
                    collapseChildren(nodeId);
                } else {
                    newExpanded.add(nodeId);
                }
                setExpandedNodes(newExpanded);
            };

            const findNode = (node, id) => {
                if (node.id === id) return node;
                if (node.children) {
                    for (let child of node.children) {
                        const found = findNode(child, id);
                        if (found) return found;
                    }
                }
                return null;
            };

            const expandAll = () => {
                const allIds = new Set();
                const traverse = (node) => {
                    allIds.add(node.id);
                    if (node.children) node.children.forEach(traverse);
                };
                traverse(cvData);
                setExpandedNodes(allIds);
            };

            const collapseAll = () => setExpandedNodes(new Set(['root']));

            const quickScan = () => {
                const firstLevel = new Set(['root']);
                cvData.children.forEach(c => firstLevel.add(c.id));
                setExpandedNodes(firstLevel);
            };

            const handleMouseDown = (e) => {
                if (e.target.closest('.node') || e.target.closest('.action-btn') || e.target.closest('.zoom-btn')) return;
                setIsDragging(true);
                setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
            };

            const handleMouseUp = () => setIsDragging(false);

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.92 : 1.08;
                setZoom(prev => Math.min(Math.max(prev * delta, 0.3), 3));
            };

            const exportToPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                let yPos = 25;
                const lineHeight = 7;
                const pageHeight = doc.internal.pageSize.height;
                const margin = 20;

                doc.setFontSize(24);
                doc.setFont(undefined, 'bold');
                doc.text('Abdullah Azhar', margin, yPos);
                yPos += 10;

                doc.setFontSize(12);
                doc.setFont(undefined, 'normal');
                doc.setTextColor(60, 60, 60);
                doc.text('Junior AI/ML Engineer', margin, yPos);
                yPos += 8;

                doc.setFontSize(10);
                doc.text('azharabdullah4k@gmail.com | +92 317 726 7361 | github.com/AbddoesAI', margin, yPos);
                yPos += 12;
                doc.setTextColor(0, 0, 0);

                const addText = (text, fontSize, isBold = false, indent = 0) => {
                    if (yPos > pageHeight - margin) { doc.addPage(); yPos = margin; }
                    doc.setFontSize(fontSize);
                    doc.setFont(undefined, isBold ? 'bold' : 'normal');
                    const lines = doc.splitTextToSize(text, 170 - indent);
                    lines.forEach(line => { doc.text(line, margin + indent, yPos); yPos += lineHeight; });
                };

                const processNode = (node, level = 0) => {
                    if (node.link) return; // skip link-only nodes
                    if (level === 1) {
                        yPos += 4;
                        addText(node.label.replace(/[🚀💼🛠🎓📄📬]/u, '').trim().toUpperCase(), 13, true);
                        yPos += 2;
                    } else if (level === 2) {
                        addText('• ' + node.label, 11, false, 5);
                        if (node.subtitle) addText('  ' + node.subtitle, 9, false, 8);
                    } else if (level > 2) {
                        addText('  – ' + node.label, 10, false, 14);
                    }
                    if (node.children) node.children.forEach(child => processNode(child, level + 1));
                };

                cvData.children.forEach(child => processNode(child, 1));
                doc.save('Abdullah_Azhar_CV.pdf');
            };

            const handleNodeClick = (node, e) => {
                if (node.link) {
                    window.open(node.link, '_blank');
                    e.stopPropagation();
                } else if (node.children) {
                    toggleNode(node.id);
                }
            };

            const renderNode = (node) => {
                const pos = nodePositions[node.id];
                if (!pos) return null;

                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = expandedNodes.has(node.id);
                const isLink = !!node.link;
                const tier = node.tier || 'secondary';
                const className = `node tier-${tier} ${isExpanded ? 'expanded' : ''} ${isLink ? 'link' : ''} node-entering`;

                return (
                    <div
                        key={node.id}
                        className={className}
                        style={{
                            left: `${pos.x}px`,
                            top: `${pos.y}px`,
                            transform: 'translate(-50%, -50%)'
                        }}
                        onClick={(e) => handleNodeClick(node, e)}
                    >
                        <div style={{ flex: 1 }}>
                            <div>{node.label}</div>
                            {node.subtitle && (
                                <div className="node-subtitle">{node.subtitle}</div>
                            )}
                        </div>
                        {hasChildren && !isLink && (
                            <span className={`expand-icon ${isExpanded ? 'expanded' : ''}`}>›</span>
                        )}
                        {isLink && (
                            <span className="expand-icon">↗</span>
                        )}
                    </div>
                );
            };

            const renderConnections = () => {
                const lines = [];
                const traverse = (node) => {
                    if (expandedNodes.has(node.id) && node.children) {
                        const parentPos = nodePositions[node.id];
                        node.children.forEach(child => {
                            const childPos = nodePositions[child.id];
                            if (parentPos && childPos) {
                                const className = `connection-line${node.tier === 'core' ? ' level-1' : ''}`;
                                const startX = parentPos.x + (parentPos.width || 200) / 2;
                                const startY = parentPos.y;
                                const endX = childPos.x - (childPos.width || 200) / 2;
                                const endY = childPos.y;
                                const midX = (startX + endX) / 2;
                                lines.push(
                                    <path
                                        key={`${node.id}-${child.id}`}
                                        className={className}
                                        d={`M ${startX} ${startY} C ${midX} ${startY}, ${midX} ${endY}, ${endX} ${endY}`}
                                    />
                                );
                            }
                            traverse(child);
                        });
                    }
                };
                traverse(cvData);
                return lines;
            };

            const renderAllNodes = () => {
                const nodes = [];
                const traverse = (node) => {
                    nodes.push(renderNode(node));
                    if (expandedNodes.has(node.id) && node.children) {
                        node.children.forEach(traverse);
                    }
                };
                traverse(cvData);
                return nodes;
            };

            return (
                <>
                    {showInstructions && (
                        <div className="instruction-overlay">
                            <h2>Abdullah Azhar — Interactive CV</h2>
                            <p><strong>Click</strong> nodes to explore details</p>
                            <p><strong>Drag</strong> canvas to pan around</p>
                            <p><strong>Scroll</strong> to zoom in/out</p>
                            <p>Use <strong>Quick Scan</strong> for a fast overview</p>
                            <button onClick={() => setShowInstructions(false)}>Start Exploring</button>
                        </div>
                    )}

                    <div className="quick-actions">
                        <button className="action-btn" onClick={quickScan}>⚡ Quick Scan</button>
                        <button className="action-btn" onClick={expandAll}>⊕ Expand All</button>
                        <button className="action-btn" onClick={collapseAll}>⊖ Collapse All</button>
                        <button className="action-btn primary" onClick={exportToPDF}>⬇ Export PDF</button>
                    </div>

                    <div
                        ref={containerRef}
                        className={`canvas-container ${isDragging ? 'dragging' : ''}`}
                        onMouseDown={handleMouseDown}
                        onMouseMove={handleMouseMove}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        onWheel={handleWheel}
                    >
                        <div style={{
                            transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                            transformOrigin: '0 0',
                            width: '6000px',
                            height: '5000px',
                            position: 'relative'
                        }}>
                            <svg style={{ position: 'absolute', top: 0, left: 0, width: '6000px', height: '5000px', overflow: 'visible' }}>
                                {renderConnections()}
                            </svg>
                            {renderAllNodes()}
                        </div>
                    </div>

                    <div className="zoom-controls">
                        <button className="zoom-btn" onClick={() => setZoom(p => Math.min(p * 1.2, 3))}>+</button>
                        <button className="zoom-btn" onClick={() => setZoom(p => Math.max(p * 0.8, 0.3))}>−</button>
                    </div>

                    <div className="control-hint">
                        <strong>Drag</strong> to explore · <strong>Scroll</strong> to zoom · <strong>Click</strong> nodes to expand · <strong>↗</strong> opens links
                    </div>
                </>
            );
        }

        ReactDOM.render(<InteractiveCV />, document.getElementById('root'));
    </script>
</body>
</html>
